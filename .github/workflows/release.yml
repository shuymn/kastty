name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  # The mise release jdx/mise-action installs; Renovate updates it.
  MISE_VERSION: 2026.10.3

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No caches: release binaries are built from the tagged sources.
      - name: Setup mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: ${{ env.MISE_VERSION }}
          cache: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - id: determine_release_tag
        name: Ensure draft release exists
        env:
          GH_PAGER: cat
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ${GITHUB_REF} != refs/tags/* ]]; then
            echo "This workflow must run from a tag push."
            exit 1
          fi

          tag="${GITHUB_REF#refs/tags/}"

          for _ in {1..12}; do
            is_draft=$(gh release view "$tag" --json isDraft -q '.isDraft' 2>/dev/null || true)
            if [[ ${is_draft} == "true" ]]; then
              echo "tag=$tag" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 5
          done

          echo "Release $tag is not a draft or does not exist."
          exit 1

      - name: Build release assets
        env:
          RELEASE_TAG: ${{ steps.determine_release_tag.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist
          short_sha="$(git rev-parse --short=7 "$GITHUB_SHA")"
          verify_target="$(go env GOOS)/$(go env GOARCH)"

          build_target() {
            local goos="$1"
            local goarch="$2"
            local archive_name="$3"
            local outfile="dist/kastty"

            make release-target \
              GOOS="$goos" \
              GOARCH="$goarch" \
              VERSION="$RELEASE_TAG" \
              COMMIT="$short_sha" \
              OUT="$outfile"

            # darwin/arm64 links with only a linker signature and darwin/amd64 with none.
            # Re-sign with ad-hoc identity so Gatekeeper won't reject the binary.
            if [[ "$goos" == darwin ]]; then
              codesign -s - --force "$outfile"
            fi

            if [[ "$goos/$goarch" == "$verify_target" ]]; then
              expected="${RELEASE_TAG}+${short_sha}"
              actual="$("$outfile" --version)"
              if [[ "$actual" != "$expected" ]]; then
                echo "version mismatch: expected=$expected actual=$actual"
                exit 1
              fi
            fi

            if [[ "$archive_name" == *.zip ]]; then
              (cd dist && zip "$archive_name" kastty)
            else
              tar -C dist -czf "dist/$archive_name" kastty
            fi
            rm -f "$outfile"
          }

          build_target darwin arm64 "kastty_${RELEASE_TAG}_darwin_arm64.zip"
          build_target darwin amd64 "kastty_${RELEASE_TAG}_darwin_amd64.zip"
          build_target linux arm64 "kastty_${RELEASE_TAG}_linux_arm64.tar.gz"
          build_target linux amd64 "kastty_${RELEASE_TAG}_linux_amd64.tar.gz"

          (
            cd dist
            shasum -a 256 \
              "kastty_${RELEASE_TAG}_darwin_arm64.zip" \
              "kastty_${RELEASE_TAG}_darwin_amd64.zip" \
              "kastty_${RELEASE_TAG}_linux_arm64.tar.gz" \
              "kastty_${RELEASE_TAG}_linux_amd64.tar.gz" > checksums.txt
          )

      - name: Upload assets to draft release
        env:
          RELEASE_TAG: ${{ steps.determine_release_tag.outputs.tag }}
          GH_PAGER: cat
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" dist/*.zip dist/*.tar.gz dist/checksums.txt --clobber

      - name: Publish draft release
        env:
          RELEASE_TAG: ${{ steps.determine_release_tag.outputs.tag }}
          GH_PAGER: cat
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          is_draft=$(gh release view "$RELEASE_TAG" --json isDraft -q '.isDraft' || echo "false")
          if [[ ${is_draft} != "true" ]]; then
            echo "No draft release found for $RELEASE_TAG"
            exit 1
          fi

          gh release edit "$RELEASE_TAG" --draft=false
