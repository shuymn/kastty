name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check if CI should be skipped
        id: check-branch
        run: |
          if [[ "${GITHUB_HEAD_REF}" =~ ^tagpr-from-v ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skipping CI for tagpr branch: ${GITHUB_HEAD_REF}"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Running CI for branch: ${GITHUB_HEAD_REF}"
          fi

      - name: Checkout
        if: steps.check-branch.outputs.skip != 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # Bun and Zig, at the versions in mise.toml.
      - name: Setup mise
        if: steps.check-branch.outputs.skip != 'true'
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - name: Install dependencies
        if: steps.check-branch.outputs.skip != 'true'
        run: bun install --frozen-lockfile

      - name: Setup Go
        if: steps.check-branch.outputs.skip != 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # go vet runs cgo, so lint needs libghostty-vt as well.
      - name: Restore libghostty-vt
        id: libghostty-vt
        if: steps.check-branch.outputs.skip != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/libghostty-vt
          key: libghostty-vt-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/libghostty-vt.sh', 'Makefile', 'mise.toml') }}

      - name: Lint
        if: steps.check-branch.outputs.skip != 'true'
        run: make lint

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check if CI should be skipped
        id: check-branch
        run: |
          if [[ "${GITHUB_HEAD_REF}" =~ ^tagpr-from-v ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skipping CI for tagpr branch: ${GITHUB_HEAD_REF}"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Running CI for branch: ${GITHUB_HEAD_REF}"
          fi

      - name: Checkout
        if: steps.check-branch.outputs.skip != 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # Bun and Zig, at the versions in mise.toml.
      - name: Setup mise
        if: steps.check-branch.outputs.skip != 'true'
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - name: Install dependencies
        if: steps.check-branch.outputs.skip != 'true'
        run: bun install --frozen-lockfile

      - name: Setup Go
        if: steps.check-branch.outputs.skip != 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Restore libghostty-vt
        id: libghostty-vt
        if: steps.check-branch.outputs.skip != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/libghostty-vt
          key: libghostty-vt-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/libghostty-vt.sh', 'Makefile', 'mise.toml') }}

      - name: Build
        if: steps.check-branch.outputs.skip != 'true'
        run: make build COMMIT="$(git rev-parse --short=7 HEAD)"

      - name: Check version output
        if: steps.check-branch.outputs.skip != 'true'
        run: |
          expected="dev+$(git rev-parse --short=7 HEAD)"
          actual="$(./kastty --version)"
          if [[ "$actual" != "$expected" ]]; then
            echo "version mismatch: expected=$expected actual=$actual"
            exit 1
          fi

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check if CI should be skipped
        id: check-branch
        run: |
          if [[ "${GITHUB_HEAD_REF}" =~ ^tagpr-from-v ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skipping CI for tagpr branch: ${GITHUB_HEAD_REF}"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Running CI for branch: ${GITHUB_HEAD_REF}"
          fi

      - name: Checkout
        if: steps.check-branch.outputs.skip != 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # Bun and Zig, at the versions in mise.toml.
      - name: Setup mise
        if: steps.check-branch.outputs.skip != 'true'
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - name: Install dependencies
        if: steps.check-branch.outputs.skip != 'true'
        run: bun install --frozen-lockfile

      - name: Setup Go
        if: steps.check-branch.outputs.skip != 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Restore libghostty-vt
        id: libghostty-vt
        if: steps.check-branch.outputs.skip != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/libghostty-vt
          key: libghostty-vt-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/libghostty-vt.sh', 'Makefile', 'mise.toml') }}

      - name: Test
        if: steps.check-branch.outputs.skip != 'true'
        run: make test
